name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use the vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi

          if ! grep -Fq "Adrestia Cozy Macchiato ${version}" "src/Adrestia Cozy Macchiato.qss"; then
            echo "The tag version does not match the QSS header." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate theme assets
        shell: python
        run: |
          import pathlib
          import re
          import sys

          root = pathlib.Path("src")
          qss = root / "Adrestia Cozy Macchiato.qss"
          asset_dir = root / "Adrestia Cozy Macchiato"

          required = [
              qss,
              asset_dir / "icons",
              asset_dir / "toolbar",
              asset_dir / "toolbar" / "LICENSE-TABLER.txt",
              pathlib.Path("CHANGELOG.md"),
              pathlib.Path("LICENSE"),
              pathlib.Path("README.md"),
          ]

          missing_required = [str(path) for path in required if not path.exists()]
          if missing_required:
              print("Missing required files:", file=sys.stderr)
              for path in missing_required:
                  print(f"- {path}", file=sys.stderr)
              raise SystemExit(1)

          content = qss.read_text(encoding="utf-8")
          references = sorted(set(re.findall(r'url\(["\']?([^\)"\']+)', content)))
          missing_assets = []

          for reference in references:
              relative = reference.removeprefix("./")
              if not (root / relative).is_file():
                  missing_assets.append(reference)

          if missing_assets:
              print("Missing QSS assets:", file=sys.stderr)
              for reference in missing_assets:
                  print(f"- {reference}", file=sys.stderr)
              raise SystemExit(1)

          print(f"Validated {len(references)} unique QSS asset references.")

      - name: Prepare release notes
        shell: python
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          import os
          import pathlib
          import re
          import subprocess
          import sys

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          repository_url = f'{os.environ["SERVER_URL"]}/{os.environ["REPOSITORY"]}'

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(
              rf"^##\s+\[?{re.escape(version)}\]?\s*$\n(.*?)(?=^##\s+\[?\d+\.\d+\.\d+\]?\s*$|\Z)",
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )

          if section is None or not section.group(1).strip():
              print(f"Missing or empty CHANGELOG.md section for {version}.", file=sys.stderr)
              raise SystemExit(1)

          tags = subprocess.check_output(
              ["git", "tag", "--list", "v[0-9]*", "--sort=-version:refname"],
              text=True,
          ).splitlines()
          previous_tag = next((candidate for candidate in tags if candidate != tag), None)

          if previous_tag:
              changes_url = f"{repository_url}/compare/{previous_tag}...{tag}"
          else:
              changes_url = f"{repository_url}/commits/{tag}"

          tag_date = subprocess.check_output(
              ["git", "for-each-ref", "--format=%(taggerdate:short)", f"refs/tags/{tag}"],
              text=True,
          ).strip()
          if not tag_date:
              tag_date = subprocess.check_output(
                  ["git", "show", "-s", "--format=%cs", tag],
                  text=True,
              ).strip()

          output = pathlib.Path("dist/release-notes.md")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              f"## [{version}]({changes_url}) ({tag_date})\n\n{section.group(1).strip()}\n",
              encoding="utf-8",
          )

          print(output.read_text(encoding="utf-8"))

      - name: Build installable archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          package_dir="dist/package"
          archive="dist/Adrestia-Cozy-${VERSION}.zip"

          mkdir -p "$package_dir"
          cp -R src/. "$package_dir/"
          cp LICENSE "$package_dir/Adrestia Cozy Macchiato/LICENSE.txt"
          cp README.md "$package_dir/Adrestia Cozy Macchiato/README.md"

          (
            cd "$package_dir"
            zip -9 -r "../$(basename "$archive")" .
          )

          test -s "$archive"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          gh release create "$GITHUB_REF_NAME" \
            "dist/Adrestia-Cozy-${VERSION}.zip#Adrestia Cozy ${VERSION} - MO2 theme.zip" \
            --verify-tag \
            --title "Adrestia Cozy ${VERSION}" \
            --notes-file "dist/release-notes.md"
